services:
  melotrack:
    build: .
    image: melotrack:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    # Paths inside the container are fixed here so a local-development .env
    # (e.g. DATABASE=./database.sql) cannot point them outside the volume.
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      DATA_DIR: /data
      DATABASE: /data/melotrack.db
      # Drop an old ./downloads folder into ./data/downloads to import it once.
      LEGACY_DOWNLOADS_DIR: /data/downloads
      STATIC_DIR: /app/web
    volumes:
      # Database and all media live here — back this folder up.
      - ./data:/data
    # Lets the container reach services on the host (e.g. an SSH SOCKS tunnel,
    # see README → "YouTube на VPS").
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional PO-token provider that helps yt-dlp pass YouTube's bot checks.
  # Start with:  docker compose --profile pot up -d
  # and set in .env:  YTDLP_POT_PROVIDER=true
  #                   YTDLP_EXTRA_ARGS=--extractor-args youtubepot-bgutilhttp:base_url=http://pot-provider:4416
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    restart: unless-stopped
    profiles: ["pot"]
